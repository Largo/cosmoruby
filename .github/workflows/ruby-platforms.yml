name: ruby-platforms

# Phase 1: Build ruby.com once, test on all available CI platforms.
# Validates that CosmoRuby works across OS/arch combinations.

env:
  COSMOCC_VERSION: 3.9.2

on:
  push:
    branches:
      - master
      - "feature/ruby-*"
  pull_request:
    paths:
      - 'third_party/ruby/**'
      - '.github/workflows/ruby-platforms.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: chetan/git-restore-mtime-action@v2

      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            .cosmocc
            o
          key: ruby-${{ env.COSMOCC_VERSION }}-${{ github.sha }}
          restore-keys: |
            ruby-${{ env.COSMOCC_VERSION }}-

      - name: support ape bins 1
        run: sudo cp -a build/bootstrap/ape.elf /usr/bin/ape

      - name: support ape bins 2
        run: sudo sh -c "echo ':APE:M::MZqFpD::/usr/bin/ape:' >/proc/sys/fs/binfmt_misc/register"

      - name: build ruby
        run: make -j2 o//third_party/ruby/ruby

      - name: package ruby.com
        run: cd third_party/ruby && bash package_ruby.sh

      - uses: actions/cache/save@v4
        with:
          path: |
            .cosmocc
            o
          key: ruby-${{ env.COSMOCC_VERSION }}-${{ github.sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: ruby-com
          path: o/third_party/ruby/ruby.com
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: diagnostic-scripts
          path: |
            third_party/ruby-wip-4.0.0/cosmo_tests/platform_diagnostic.rb
            third_party/ruby-wip-4.0.0/cosmo_tests/run_platform_diagnostic.sh
            third_party/ruby-wip-4.0.0/cosmo_tests/summarise_results.rb
          retention-days: 30

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x86_64, name: linux-x86, shell: bash }
          - { os: ubuntu-24.04-arm, arch: aarch64, name: linux-arm64, shell: bash }
          - { os: macos-15-intel, arch: x86_64, name: macos-x86, shell: bash }
          - { os: macos-latest, arch: aarch64, name: macos-arm64, shell: bash }
          - { os: windows-latest, arch: x86_64, name: windows-x86, shell: pwsh }
          - { os: windows-11-arm, arch: aarch64, name: windows-arm64, shell: pwsh }
        # Self-hosted BSD runners -- future enhancement
        # - { os: freebsd, arch: x86_64, name: freebsd-x86 }
        # - { os: openbsd, arch: x86_64, name: openbsd-x86 }

    runs-on: ${{ matrix.os }}
    name: test-${{ matrix.name }}
    continue-on-error: true
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            build/bootstrap
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: ruby-com
          path: .

      - uses: actions/download-artifact@v4
        with:
          name: diagnostic-scripts
          path: scripts

      - name: setup ape loader (linux)
        if: runner.os == 'Linux'
        run: |
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            sudo cp -a build/bootstrap/ape.aarch64 /usr/bin/ape
          else
            sudo cp -a build/bootstrap/ape.elf /usr/bin/ape
          fi
          sudo sh -c "echo ':APE:M::MZqFpD::/usr/bin/ape:' >/proc/sys/fs/binfmt_misc/register"

      - name: make executable (unix)
        if: runner.os != 'Windows'
        run: chmod +x ruby.com

      - name: run diagnostic (unix)
        if: runner.os != 'Windows'
        run: |
          ./ruby.com --disable-gems \
            scripts/third_party/ruby-wip-4.0.0/cosmo_tests/platform_diagnostic.rb \
            --json > ${{ matrix.name }}-results.json
          cat ${{ matrix.name }}-results.json

      - name: rename for windows
        if: runner.os == 'Windows'
        run: Rename-Item -Path ruby.com -NewName ruby.exe

      - name: run diagnostic (windows)
        if: runner.os == 'Windows'
        run: |
          .\ruby.exe --disable-gems `
            scripts/third_party/ruby-wip-4.0.0/cosmo_tests/platform_diagnostic.rb `
            --json | Out-File -Encoding utf8 ${{ matrix.name }}-results.json
          Get-Content ${{ matrix.name }}-results.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.name }}
          path: ${{ matrix.name }}-results.json
          retention-days: 30

  summary:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            build/bootstrap
            third_party/ruby-wip-4.0.0/cosmo_tests/summarise_results.rb
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: ruby-com
          path: .

      - name: setup ape loader
        run: |
          sudo cp -a build/bootstrap/ape.elf /usr/bin/ape
          sudo sh -c "echo ':APE:M::MZqFpD::/usr/bin/ape:' >/proc/sys/fs/binfmt_misc/register"

      - name: download all result artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results
          merge-multiple: true

      - name: make executable
        run: chmod +x ruby.com

      - name: generate summary
        run: |
          echo "## CosmoRuby Cross-Platform Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          ls results/*.json 2>/dev/null && \
            ./ruby.com --disable-gems \
              third_party/ruby-wip-4.0.0/cosmo_tests/summarise_results.rb \
              results/*.json >> "$GITHUB_STEP_SUMMARY" || \
            echo "No result files found." >> "$GITHUB_STEP_SUMMARY"
