name: cosmo-ci-fat-smoke-test

# Validate fat APE binary execution across all CI platforms.
# Binary is built locally and uploaded to a GitHub release.
# This workflow downloads it and runs it on every available runner.
#
# The binary keeps its original name (e.g. toybox.com, ruby.com).
# If a test.sh is uploaded alongside the binary, it is run instead
# of the default test. test.sh receives the binary path as $1 and
# should exit 0 for pass, non-zero for fail.
#
# Usage:
#   1. Build fat binary:  ./bake o//third_party/toybox/toybox
#   2. Use trigger script: ./fat_smoke_test.sh releases/toybox.com
#   3. With custom test:   ./fat_smoke_test.sh releases/toybox.com bin/test_toybox_ci.sh

on:
  push:
    branches:
      - master
      - "feature/ruby-*"
    paths:
      - '.github/workflows/cosmo-ci-fat-smoke-test.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag containing the APE binary'
        required: true
        default: 'fat-smoke-test'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_TAG: ${{ inputs.release_tag || 'fat-smoke-test' }}
  REPO: ${{ github.repository }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x86_64, name: linux-x86, shell: bash }
          - { os: ubuntu-24.04-arm, arch: aarch64, name: linux-arm64, shell: bash }
          - { os: macos-15-intel, arch: x86_64, name: macos-x86, shell: bash }
          - { os: macos-latest, arch: aarch64, name: macos-arm64, shell: bash }
          - { os: windows-latest, arch: x86_64, name: windows-x86, shell: pwsh }
          - { os: windows-11-arm, arch: aarch64, name: windows-arm64, shell: pwsh }

    runs-on: ${{ matrix.os }}
    name: test-${{ matrix.name }}
    continue-on-error: true
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v5
        if: runner.os == 'Linux'
        with:
          sparse-checkout: |
            build/bootstrap
          sparse-checkout-cone-mode: false

      - name: download assets (unix)
        if: runner.os != 'Windows'
        run: |
          # Download into a dedicated directory to avoid mixing with
          # checkout artifacts (e.g. build/bootstrap on Linux).
          mkdir -p _smoke
          gh release download "$RELEASE_TAG" --repo "$REPO" --dir _smoke
          # Find the binary: a regular file that isn't test.sh
          BINARY=$(find _smoke -maxdepth 1 -type f ! -name 'test.sh' -printf '%f\n' | head -1)
          if [ -z "$BINARY" ]; then
            echo "Error: no binary found in release assets"
            ls -la _smoke/
            exit 1
          fi
          mv "_smoke/$BINARY" .
          chmod +x "$BINARY"
          echo "BINARY=$BINARY" >> "$GITHUB_ENV"
          echo "Downloaded: $BINARY"
          if [ -f "_smoke/test.sh" ]; then
            mv _smoke/test.sh .
            chmod +x test.sh
            echo "HAS_TEST_SCRIPT=true" >> "$GITHUB_ENV"
            echo "Downloaded: test.sh"
          fi
          rm -rf _smoke
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: download assets (windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path _smoke | Out-Null
          gh release download "$env:RELEASE_TAG" --repo "$env:REPO" --dir _smoke
          $binary = Get-ChildItem _smoke -File | Where-Object { $_.Name -ne 'test.sh' } | Select-Object -First 1
          if (-not $binary) {
            Write-Host "Error: no binary found in release assets"
            Get-ChildItem _smoke
            exit 1
          }
          Move-Item $binary.FullName .
          echo "BINARY=$($binary.Name)" >> $env:GITHUB_ENV
          Write-Host "Downloaded: $($binary.Name)"
          if (Test-Path _smoke/test.sh) {
            Move-Item _smoke/test.sh .
            echo "HAS_TEST_SCRIPT=true" >> $env:GITHUB_ENV
            Write-Host "Downloaded: test.sh"
          }
          Remove-Item _smoke -Recurse -Force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: setup ape loader (linux)
        if: runner.os == 'Linux'
        run: |
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            sudo cp -a build/bootstrap/ape.aarch64 /usr/bin/ape
          else
            sudo cp -a build/bootstrap/ape.elf /usr/bin/ape
          fi
          sudo sh -c "echo ':APE:M::MZqFpD::/usr/bin/ape:' >/proc/sys/fs/binfmt_misc/register"

      - name: run test (unix)
        if: runner.os != 'Windows'
        run: |
          if [ "$HAS_TEST_SCRIPT" = "true" ]; then
            echo "Running custom test: bash test.sh ./$BINARY"
            bash test.sh "./$BINARY"
          else
            echo "Running default test: ./$BINARY"
            ./"$BINARY"
          fi
          echo "PASS: $BINARY exited 0 on ${{ matrix.name }}"

      - name: run test (windows)
        if: runner.os == 'Windows'
        run: |
          if ($env:HAS_TEST_SCRIPT -eq "true") {
            Write-Host "Running custom test: bash test.sh .\$env:BINARY"
            bash test.sh ".\$env:BINARY"
          } else {
            Write-Host "Running default test: .\$env:BINARY"
            & ".\$env:BINARY"
          }
          Write-Host "PASS: $env:BINARY exited 0 on ${{ matrix.name }}"

  summary:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: generate summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Fat APE Smoke Test Results

          See individual job logs for per-platform pass/fail.
          EOF
