name: cosmoruby-test

# Reusable job: download a built CosmoRuby artifact and run the same test
# scripts on every requested platform.  The .rb test files live in
# third_party/ruby/cosmo_tests/ and are byte-identical across platforms; only
# the driver differs (POSIX sh vs PowerShell), because that is how the
# binaries are actually invoked by users.

on:
  workflow_call:
    inputs:
      artifact_name:
        type: string
        default: 'cosmoruby-x86_64'
      runners:
        description: 'JSON array of {name, os, experimental} test targets'
        type: string
        default: >-
          [
            {"name": "linux-x86_64",   "os": "ubuntu-latest",    "experimental": false},
            {"name": "windows-x86_64", "os": "windows-latest",   "experimental": false},
            {"name": "macos-x86_64",   "os": "macos-15-intel",   "experimental": false},
            {"name": "macos-arm64",    "os": "macos-latest",     "experimental": true},
            {"name": "linux-arm64",    "os": "ubuntu-24.04-arm", "experimental": true}
          ]

permissions:
  contents: read

jobs:
  test:
    name: test-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.runners) }}

    steps:
      - name: checkout test scripts only
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /.github/scripts/
            /third_party/ruby-wip-4.0.6/cosmo_tests/
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: dist

      - name: run acceptance tests (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x dist/*.com
          bash .github/scripts/test-cosmoruby.sh dist

      # GitHub's Windows images set the machine execution policy to
      # Unrestricted, so a repo .ps1 runs as-is.  If a future image tightens
      # that, inline the script body into this step rather than loosening the
      # policy on the runner.
      - name: run acceptance tests (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\.github\scripts\test-cosmoruby.ps1 -BinDir dist
