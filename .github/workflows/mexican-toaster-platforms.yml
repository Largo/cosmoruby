name: mexican-toaster-platforms

# Phase 1: Validate Mexican Toaster APE binaries across all CI platforms.
# Binaries are built locally with bin/build_mexican_toaster.sh and uploaded
# to a GitHub release. This workflow downloads them and tests them on every
# available runner.
#
# Usage:
#   1. Build fat binaries:  bin/build_mexican_toaster.sh -j$(nproc)
#   2. Use trigger script:  ./trigger_mexican_toaster_test.sh

on:
  push:
    branches:
      - master
      - "feature/ruby-*"
    paths:
      - '.github/workflows/mexican-toaster-platforms.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag containing Mexican Toaster binaries'
        required: true
        default: 'mexican-toaster-test'

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || 'mexican-toaster-test' }}
  REPO: ${{ github.repository }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x86_64, name: linux-x86, shell: bash }
          - { os: ubuntu-24.04-arm, arch: aarch64, name: linux-arm64, shell: bash }
          - { os: macos-15-intel, arch: x86_64, name: macos-x86, shell: bash }
          - { os: macos-latest, arch: aarch64, name: macos-arm64, shell: bash }
          - { os: windows-latest, arch: x86_64, name: windows-x86, shell: pwsh }
          - { os: windows-11-arm, arch: aarch64, name: windows-arm64, shell: pwsh }

    runs-on: ${{ matrix.os }}
    name: test-${{ matrix.name }}
    continue-on-error: true
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v4
        if: runner.os == 'Linux'
        with:
          sparse-checkout: |
            build/bootstrap
          sparse-checkout-cone-mode: false

      - name: download binaries (unix)
        if: runner.os != 'Windows'
        run: |
          gh release download "$RELEASE_TAG" --repo "$REPO" --pattern 'mtsh.com' --dir .
          gh release download "$RELEASE_TAG" --repo "$REPO" --pattern 'lsdir.com' --dir .
          gh release download "$RELEASE_TAG" --repo "$REPO" --pattern 'caboose.com' --dir .
          chmod +x mtsh.com lsdir.com caboose.com
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: download binaries (windows)
        if: runner.os == 'Windows'
        run: |
          gh release download "$env:RELEASE_TAG" --repo "$env:REPO" --pattern 'mtsh.com' --dir .
          gh release download "$env:RELEASE_TAG" --repo "$env:REPO" --pattern 'lsdir.com' --dir .
          gh release download "$env:RELEASE_TAG" --repo "$env:REPO" --pattern 'caboose.com' --dir .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: setup ape loader (linux)
        if: runner.os == 'Linux'
        run: |
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            sudo cp -a build/bootstrap/ape.aarch64 /usr/bin/ape
          else
            sudo cp -a build/bootstrap/ape.elf /usr/bin/ape
          fi
          sudo sh -c "echo ':APE:M::MZqFpD::/usr/bin/ape:' >/proc/sys/fs/binfmt_misc/register"

      - name: test mtsh.com (unix)
        if: runner.os != 'Windows'
        run: |
          OUTPUT=$(./mtsh.com -c "echo mtsh-ok")
          echo "Output: $OUTPUT"
          if [ "$OUTPUT" = "mtsh-ok" ]; then
            echo "PASS: mtsh.com works on ${{ matrix.name }}"
          else
            echo "FAIL: unexpected output on ${{ matrix.name }}"
            exit 1
          fi

      - name: test mtsh.com (windows)
        if: runner.os == 'Windows'
        run: |
          $output = & .\mtsh.com -c "echo mtsh-ok"
          Write-Host "Output: $output"
          if ($output -eq "mtsh-ok") {
            Write-Host "PASS: mtsh.com works on ${{ matrix.name }}"
          } else {
            Write-Host "FAIL: unexpected output on ${{ matrix.name }}"
            exit 1
          }

      - name: test lsdir.com (unix)
        if: runner.os != 'Windows'
        run: |
          OUTPUT=$(./lsdir.com | head -1)
          if [ -n "$OUTPUT" ]; then
            echo "PASS: lsdir.com works on ${{ matrix.name }} (found: $OUTPUT)"
          else
            echo "FAIL: lsdir.com produced no output on ${{ matrix.name }}"
            exit 1
          fi

      - name: test lsdir.com (windows)
        if: runner.os == 'Windows'
        run: |
          $output = & .\lsdir.com | Select-Object -First 1
          if ($output) {
            Write-Host "PASS: lsdir.com works on ${{ matrix.name }}"
          } else {
            Write-Host "FAIL: lsdir.com produced no output on ${{ matrix.name }}"
            exit 1
          }

      - name: test caboose.com (unix)
        if: runner.os != 'Windows'
        run: |
          OUTPUT=$(./caboose.com check 2>&1)
          echo "Output: $OUTPUT"
          if echo "$OUTPUT" | grep -q "healthy"; then
            echo "PASS: caboose.com works on ${{ matrix.name }}"
          else
            echo "WARNING: caboose.com status unclear on ${{ matrix.name }}"
            # Don't fail - caboose might behave differently on different platforms
          fi

      - name: test caboose.com (windows)
        if: runner.os == 'Windows'
        run: |
          $output = & .\caboose.com check 2>&1
          Write-Host "Output: $output"
          if ($output -match "healthy") {
            Write-Host "PASS: caboose.com works on ${{ matrix.name }}"
          } else {
            Write-Host "WARNING: caboose.com status unclear on ${{ matrix.name }}"
            # Don't fail - caboose might behave differently on different platforms
          }

  summary:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: generate summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Mexican Toaster Cross-Platform Results

          Tests three APE binaries across 6 platforms:
          - **mtsh.com** - Mexican Toaster Shell
          - **lsdir.com** - Directory listing tool
          - **caboose.com** - Container/overlay filesystem tool

          See individual job logs for per-platform pass/fail details.
          EOF
