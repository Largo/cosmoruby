name: cosmo-ci-fat-smoke-test

# Validate fat APE binary execution across all CI platforms.
# Binary is built locally and uploaded to a GitHub release.
# This workflow downloads it and runs it on every available runner.
#
# Usage:
#   1. Build fat binary:  third_party/wrapper/ccc -o /tmp/hello examples/hello.c
#      or:                ./bake o//examples/hello
#   2. Use trigger script: ./fat_smoke_test.sh /tmp/hello

# • These are deprecation warnings from GitHub Actions — Node.js 20 is being phased out in favor of Node.js 24.
#   The actions/checkout@v4 action still uses Node 20 internally.
#
#   Quick Fix
#
#   Add this environment variable to your workflow file to opt into Node.js 24 now:
#
#   # In .github/workflows/your-workflow.yml
#   env:
#     FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
#
#   Or set it at the job level:
#
#   jobs:
#     test:
#       runs-on: ubuntu-latest
#       env:
#         FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
#       steps:
#         - uses: actions/checkout@v5
#         ...

on:
  push:
    branches:
      - master
      - "feature/ruby-*"
    paths:
      - '.github/workflows/cosmo-ci-fat-smoke-test.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag containing the APE binary'
        required: true
        default: 'fat-smoke-test'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_TAG: ${{ inputs.release_tag || 'fat-smoke-test' }}
  REPO: ${{ github.repository }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x86_64, name: linux-x86, shell: bash }
          - { os: ubuntu-24.04-arm, arch: aarch64, name: linux-arm64, shell: bash }
          - { os: macos-15-intel, arch: x86_64, name: macos-x86, shell: bash }
          - { os: macos-latest, arch: aarch64, name: macos-arm64, shell: bash }
          - { os: windows-latest, arch: x86_64, name: windows-x86, shell: pwsh }
          - { os: windows-11-arm, arch: aarch64, name: windows-arm64, shell: pwsh }

    runs-on: ${{ matrix.os }}
    name: test-${{ matrix.name }}
    continue-on-error: true
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v5
        if: runner.os == 'Linux'
        with:
          sparse-checkout: |
            build/bootstrap
          sparse-checkout-cone-mode: false

      - name: download binary (unix)
        if: runner.os != 'Windows'
        run: |
          gh release download "$RELEASE_TAG" --repo "$REPO" --pattern 'a.out' --dir .
          chmod +x a.out
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: download binary (windows)
        if: runner.os == 'Windows'
        run: |
          gh release download "$env:RELEASE_TAG" --repo "$env:REPO" --pattern 'a.out' --dir .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: setup ape loader (linux)
        if: runner.os == 'Linux'
        run: |
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            sudo cp -a build/bootstrap/ape.aarch64 /usr/bin/ape
          else
            sudo cp -a build/bootstrap/ape.elf /usr/bin/ape
          fi
          sudo sh -c "echo ':APE:M::MZqFpD::/usr/bin/ape:' >/proc/sys/fs/binfmt_misc/register"

      - name: run binary (unix)
        if: runner.os != 'Windows'
        run: |
          ./a.out
          echo "PASS: a.out exited 0 on ${{ matrix.name }}"

      - name: run binary (windows)
        if: runner.os == 'Windows'
        run: |
          & .\a.out
          Write-Host "PASS: a.out exited 0 on ${{ matrix.name }}"

  summary:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: generate summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Fat APE Smoke Test Results

          See individual job logs for per-platform pass/fail.
          EOF
