name: ruby-platforms

# Cross-platform test for CosmoRuby.
# Downloads a pre-built ruby.com from a GitHub release and runs
# diagnostic tests on all available CI platforms.
#
# Usage:
#   1. Build and package ruby.com locally
#   2. Upload to a release: gh release upload ruby-test ruby.com --clobber
#   3. Trigger: gh workflow run ruby-platforms.yml
#      (or push to feature/ruby-* branch)

on:
  push:
    branches:
      - master
      - "feature/ruby-*"
    paths:
      - '.github/workflows/ruby-platforms.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag containing ruby.com binary'
        required: true
        default: 'ruby-test'

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || 'ruby-test' }}
  REPO: ${{ github.repository }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x86_64, name: linux-x86, shell: bash }
          - { os: ubuntu-24.04-arm, arch: aarch64, name: linux-arm64, shell: bash }
          - { os: macos-15-intel, arch: x86_64, name: macos-x86, shell: bash }
          - { os: macos-latest, arch: aarch64, name: macos-arm64, shell: bash }
          - { os: windows-latest, arch: x86_64, name: windows-x86, shell: pwsh }
          - { os: windows-11-arm, arch: aarch64, name: windows-arm64, shell: pwsh }
        # Self-hosted BSD runners -- future enhancement
        # - { os: freebsd, arch: x86_64, name: freebsd-x86 }
        # - { os: openbsd, arch: x86_64, name: openbsd-x86 }

    runs-on: ${{ matrix.os }}
    name: test-${{ matrix.name }}
    continue-on-error: true
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v4
        if: runner.os == 'Linux'
        with:
          sparse-checkout: |
            build/bootstrap
          sparse-checkout-cone-mode: false

      - name: download ruby.com (unix)
        if: runner.os != 'Windows'
        run: |
          gh release download "$RELEASE_TAG" --repo "$REPO" --pattern 'ruby.com' --dir .
          chmod +x ruby.com
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: download ruby.com (windows)
        if: runner.os == 'Windows'
        run: |
          gh release download "$env:RELEASE_TAG" --repo "$env:REPO" --pattern 'ruby.com' --dir .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: setup ape loader (linux)
        if: runner.os == 'Linux'
        run: |
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            sudo cp -a build/bootstrap/ape.aarch64 /usr/bin/ape
          else
            sudo cp -a build/bootstrap/ape.elf /usr/bin/ape
          fi
          sudo sh -c "echo ':APE:M::MZqFpD::/usr/bin/ape:' >/proc/sys/fs/binfmt_misc/register"

      - name: quick sanity check (unix)
        if: runner.os != 'Windows'
        run: |
          OUTPUT=$(./ruby.com --disable-gems -e 'puts "#{RUBY_VERSION} #{RUBY_PLATFORM}"')
          echo "Ruby: $OUTPUT"

      - name: quick sanity check (windows)
        if: runner.os == 'Windows'
        run: |
          Rename-Item -Path ruby.com -NewName ruby.exe
          $output = & .\ruby.exe --disable-gems -e 'puts "#{RUBY_VERSION} #{RUBY_PLATFORM}"'
          Write-Host "Ruby: $output"

      - name: run diagnostic (unix)
        if: runner.os != 'Windows'
        run: |
          ./ruby.com --disable-gems -e '
          require "etc"
          require "rbconfig"
          require "tempfile"
          require "fileutils"

          platform = Etc.uname[:sysname] rescue RUBY_PLATFORM
          arch = Etc.uname[:machine] rescue RbConfig::CONFIG["host_cpu"]

          results = []
          pass = 0
          fail = 0
          warn = 0

          check = ->(name, &block) {
            begin
              ok = block.call
              if ok
                results << "[PASS] #{name}"
                pass += 1
              else
                results << "[FAIL] #{name}"
                fail += 1
              end
            rescue => e
              results << "[FAIL] #{name} -- #{e.class}: #{e.message}"
              fail += 1
            end
          }

          soft = ->(name, &block) {
            begin
              ok = block.call
              if ok
                results << "[PASS] #{name}"
                pass += 1
              else
                results << "[WARN] #{name}"
                warn += 1
              end
            rescue => e
              results << "[WARN] #{name} -- #{e.class}: #{e.message}"
              warn += 1
            end
          }

          check.("ruby_version")     { RUBY_VERSION && !RUBY_VERSION.empty? }
          check.("ruby_engine")      { RUBY_ENGINE == "ruby" }
          check.("ruby_platform")    { RUBY_PLATFORM && !RUBY_PLATFORM.empty? }
          check.("zip_exists")       { Dir.exist?("/zip") }
          check.("stdlib_files")     { Dir["/zip/**/*"].select { |f| File.file?(f) }.size > 100 }
          check.("packaged")         { defined?(RUBY_COSMO_PACKAGED) && RUBY_COSMO_PACKAGED }
          check.("load_path")        { $LOAD_PATH.all? { |p| p.start_with?("/zip") } }
          check.("no_dupe_paths")    { $LOAD_PATH.size == $LOAD_PATH.uniq.size }
          check.("json")             { require "json"; JSON.generate({a: 1}) == "{\"a\":1}" }
          check.("zlib")             { require "zlib"; Zlib.crc32("test").is_a?(Integer) }
          check.("digest")           { require "digest"; Digest::SHA256.hexdigest("test").length == 64 }
          check.("stringio")         { require "stringio"; StringIO.new("test").read == "test" }
          check.("date")             { require "date"; Date.today.is_a?(Date) }
          check.("uri")              { require "uri"; URI.parse("https://example.com").host == "example.com" }
          check.("yaml")             { require "yaml"; YAML.dump({a: 1}) =~ /a:/ ? true : false }
          check.("tempfile")         { tf = Tempfile.new("ci"); tf.write("ok"); tf.rewind; tf.read == "ok" }
          check.("thread")           { r = nil; Thread.new { r = 42 }.join(5); r == 42 }
          check.("mutex")            { Mutex.new.synchronize { true } }
          check.("rubygems")         { require "rubygems"; Gem::VERSION && true }
          soft.("encoding_utf8")     { Encoding.default_external == Encoding::UTF_8 }
          check.("unicode")          { s = "\u{1F600}"; s.length == 1 && s.bytesize == 4 }
          check.("pid")              { Process.pid > 0 }
          check.("env_path")         { ENV["PATH"] && !ENV["PATH"].empty? }

          puts "CosmoRuby Diagnostic: #{platform}/#{arch}"
          puts "Ruby #{RUBY_VERSION} (#{RUBY_ENGINE}) [#{RUBY_PLATFORM}]"
          puts "=" * 60
          results.each { |r| puts "  #{r}" }
          puts "=" * 60
          puts "  Pass: #{pass}  Fail: #{fail}  Warn: #{warn}"
          exit(fail > 0 ? 1 : 0)
          ' 2>&1 | tee ${{ matrix.name }}-results.txt

      - name: run diagnostic (windows)
        if: runner.os == 'Windows'
        run: |
          $script = @'
          require "etc"
          require "rbconfig"
          require "tempfile"
          require "fileutils"

          platform = Etc.uname[:sysname] rescue RUBY_PLATFORM
          arch = Etc.uname[:machine] rescue RbConfig::CONFIG["host_cpu"]

          results = []
          pass = 0
          fail = 0
          warn = 0

          check = ->(name, &block) {
            begin
              ok = block.call
              if ok
                results << "[PASS] #{name}"
                pass += 1
              else
                results << "[FAIL] #{name}"
                fail += 1
              end
            rescue => e
              results << "[FAIL] #{name} -- #{e.class}: #{e.message}"
              fail += 1
            end
          }

          soft = ->(name, &block) {
            begin
              ok = block.call
              if ok
                results << "[PASS] #{name}"
                pass += 1
              else
                results << "[WARN] #{name}"
                warn += 1
              end
            rescue => e
              results << "[WARN] #{name} -- #{e.class}: #{e.message}"
              warn += 1
            end
          }

          check.("ruby_version")     { RUBY_VERSION && !RUBY_VERSION.empty? }
          check.("ruby_engine")      { RUBY_ENGINE == "ruby" }
          check.("ruby_platform")    { RUBY_PLATFORM && !RUBY_PLATFORM.empty? }
          check.("zip_exists")       { Dir.exist?("/zip") }
          check.("stdlib_files")     { Dir["/zip/**/*"].select { |f| File.file?(f) }.size > 100 }
          check.("packaged")         { defined?(RUBY_COSMO_PACKAGED) && RUBY_COSMO_PACKAGED }
          check.("load_path")        { $LOAD_PATH.all? { |p| p.start_with?("/zip") } }
          check.("no_dupe_paths")    { $LOAD_PATH.size == $LOAD_PATH.uniq.size }
          check.("json")             { require "json"; JSON.generate({a: 1}) == "{\"a\":1}" }
          check.("zlib")             { require "zlib"; Zlib.crc32("test").is_a?(Integer) }
          check.("digest")           { require "digest"; Digest::SHA256.hexdigest("test").length == 64 }
          check.("stringio")         { require "stringio"; StringIO.new("test").read == "test" }
          check.("date")             { require "date"; Date.today.is_a?(Date) }
          check.("uri")              { require "uri"; URI.parse("https://example.com").host == "example.com" }
          check.("yaml")             { require "yaml"; YAML.dump({a: 1}) =~ /a:/ ? true : false }
          check.("tempfile")         { tf = Tempfile.new("ci"); tf.write("ok"); tf.rewind; tf.read == "ok" }
          check.("thread")           { r = nil; Thread.new { r = 42 }.join(5); r == 42 }
          check.("mutex")            { Mutex.new.synchronize { true } }
          check.("rubygems")         { require "rubygems"; Gem::VERSION && true }
          soft.("encoding_utf8")     { Encoding.default_external == Encoding::UTF_8 }
          check.("unicode")          { s = "\u{1F600}"; s.length == 1 && s.bytesize == 4 }
          check.("pid")              { Process.pid > 0 }
          check.("env_path")         { ENV["PATH"] && !ENV["PATH"].empty? }

          puts "CosmoRuby Diagnostic: #{platform}/#{arch}"
          puts "Ruby #{RUBY_VERSION} (#{RUBY_ENGINE}) [#{RUBY_PLATFORM}]"
          puts "=" * 60
          results.each { |r| puts "  #{r}" }
          puts "=" * 60
          puts "  Pass: #{pass}  Fail: #{fail}  Warn: #{warn}"
          exit(fail > 0 ? 1 : 0)
          '@
          $script | Out-File -Encoding utf8 diag.rb
          & .\ruby.exe --disable-gems diag.rb 2>&1 | Tee-Object -FilePath "${{ matrix.name }}-results.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.name }}
          path: ${{ matrix.name }}-results.txt
          retention-days: 30

  summary:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: download all result artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results
          merge-multiple: true

      - name: generate summary
        run: |
          echo "## CosmoRuby Cross-Platform Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for f in results/*.txt; do
            [ -f "$f" ] && cat "$f" && echo ""
          done >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
