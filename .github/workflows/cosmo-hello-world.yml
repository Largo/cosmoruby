name: cosmo-hello-world

# Phase 0: Validate APE binary execution across all CI platforms.
# Binary is built locally and uploaded to a GitHub release.
# This workflow downloads it and runs it on every available runner.
#
# Usage:
#   1. Build locally:  make -j1 o//examples/hello
#   2. Create release:  gh release create hello-test o//examples/hello
#   3. Push (or use the trigger script):  ./trigger_hello_test.sh

on:
  push:
    branches:
      - master
      - "feature/ruby-*"
    paths:
      - '.github/workflows/cosmo-hello-world.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag containing hello binary'
        required: true
        default: 'hello-test'

env:
  RELEASE_TAG: ${{ inputs.release_tag || 'hello-test' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x86_64, name: linux-x86, shell: bash }
          - { os: ubuntu-24.04-arm, arch: aarch64, name: linux-arm64, shell: bash }
          - { os: macos-15-intel, arch: x86_64, name: macos-x86, shell: bash }
          - { os: macos-15, arch: aarch64, name: macos-arm64, shell: bash }
          - { os: windows-latest, arch: x86_64, name: windows-x86, shell: pwsh }
          - { os: windows-11-arm, arch: aarch64, name: windows-arm64, shell: pwsh }

    runs-on: ${{ matrix.os }}
    name: test-${{ matrix.name }}
    continue-on-error: true
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            build/bootstrap
          sparse-checkout-cone-mode: false

      - name: download hello binary (unix)
        if: runner.os != 'Windows'
        run: |
          gh release download "$RELEASE_TAG" --pattern 'hello' --dir .
          chmod +x hello
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: download hello binary (windows)
        if: runner.os == 'Windows'
        run: |
          gh release download "$env:RELEASE_TAG" --pattern 'hello' --dir .
          Rename-Item -Path hello -NewName hello.com
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: setup ape loader (linux)
        if: runner.os == 'Linux'
        run: |
          sudo cp -a build/bootstrap/ape.elf /usr/bin/ape
          sudo sh -c "echo ':APE:M::MZqFpD::/usr/bin/ape:' >/proc/sys/fs/binfmt_misc/register"

      - name: run hello (unix)
        if: runner.os != 'Windows'
        run: |
          OUTPUT=$(./hello)
          echo "Output: $OUTPUT"
          if [ "$OUTPUT" = "hello world" ]; then
            echo "PASS: hello.com works on ${{ matrix.name }}"
          else
            echo "FAIL: unexpected output on ${{ matrix.name }}"
            exit 1
          fi

      - name: run hello (windows)
        if: runner.os == 'Windows'
        run: |
          $output = & .\hello.com
          Write-Host "Output: $output"
          if ($output -eq "hello world") {
            Write-Host "PASS: hello.com works on ${{ matrix.name }}"
          } else {
            Write-Host "FAIL: unexpected output on ${{ matrix.name }}"
            exit 1
          }

  summary:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: generate summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## APE Hello World Cross-Platform Results

          See individual job logs for per-platform pass/fail.
          EOF
